services:
  postgres:
    image: postgres:15
    container_name: postgres_calculadora
    restart: always
    environment:
      POSTGRES_DB: calculadora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8745
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: calculadora_app
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/calculadora
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 8745

volumes:
  postgres_data:
