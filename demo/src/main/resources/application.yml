spring:
  application:
    name: CalculadoradeJuros

  datasource:
    url: jdbc:postgresql://localhost:5432/calculadora
    username: postgres
    password: 8745

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  api:
    security:
      token:
        secret: ${JWT_SECRET:my-super-secret-key-with-more-than-32-characters}


